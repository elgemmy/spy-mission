<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spymaster Mission — One clue. 25 words. Two teams.</title>
<meta name="description" content="لعبة كلمات وجواسيس للعائلة — بالعربية والإنجليزية، بدون تطبيق. A family word-spy party game in the browser." />
<meta property="og:title" content="Spymaster Mission" />
<meta property="og:description" content="One clue. 25 words. Two teams. Play with your family in the browser — Arabic or English." />
<meta name="theme-color" content="#f1e8da" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='10' height='10' rx='2.5' fill='%23c8553d'/%3E%3Crect x='13' y='1' width='10' height='10' rx='2.5' fill='%232f7e8c'/%3E%3Crect x='1' y='13' width='10' height='10' rx='2.5' fill='%23cba968'/%3E%3Crect x='13' y='13' width='10' height='10' rx='2.5' fill='%232b2622'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
html, body { margin: 0; padding: 0; background: #f1e8da; }
:root{--cn-bg:#f1e8da;--cn-surface:#fdfaf3;--cn-surface-2:#f6efe2;--cn-ink:#2f2a24;--cn-ink-soft:#7d7263;--cn-line:#e4dac8;--cn-red:#c8553d;--cn-red-ink:#9a3b28;--cn-red-tint:#f4ddd4;--cn-red-on:#fdf3ec;--cn-blue:#2f7e8c;--cn-blue-ink:#1f5a66;--cn-blue-tint:#d8e9eb;--cn-blue-on:#eef7f8;--cn-neutral:#cba968;--cn-neutral-ink:#7a5e2e;--cn-neutral-tint:#efe5cd;--cn-neutral-on:#2f2616;--cn-assassin:#2b2622;--cn-assassin-tint:#d8cfc4;--cn-assassin-on:#f0e9dd;--cn-r-card:12px;--cn-r-chip:999px;--cn-r-bar:18px}
a{color:var(--cn-red-ink)} a:hover{color:var(--cn-red)}
.wrap{max-width:1060px;margin:0 auto;box-sizing:border-box}
.btnP{display:inline-block;background:var(--cn-red);color:var(--cn-red-on) !important;font-weight:700;border-radius:var(--cn-r-bar);text-decoration:none;box-shadow:0 6px 18px color-mix(in srgb, var(--cn-red) 35%, transparent);transition:transform .18s cubic-bezier(.34,1.2,.46,1), box-shadow .18s}
.btnP:hover{transform:translateY(-2px);box-shadow:0 10px 24px color-mix(in srgb, var(--cn-red) 42%, transparent);color:var(--cn-red-on)}
.btnS{display:inline-block;background:var(--cn-surface);color:var(--cn-ink) !important;font-weight:700;border:1px solid var(--cn-line);border-radius:var(--cn-r-bar);text-decoration:none;transition:transform .18s cubic-bezier(.34,1.2,.46,1)}
.btnS:hover{transform:translateY(-2px)}
.heroGrid{display:grid;grid-template-columns:1.02fr 1fr;gap:52px;align-items:center}
.stepGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.featGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tilt{transform:rotate(-1.4deg);transition:transform .35s cubic-bezier(.34,1.2,.46,1)}
.tilt:hover{transform:rotate(0deg)}
@media(max-width:940px){.heroGrid{grid-template-columns:1fr;gap:40px}.featGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.stepGrid{grid-template-columns:1fr}}
@media(max-width:520px){.featGrid{grid-template-columns:1fr}}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f1e8da;z-index:99;transition:opacity .35s}
#boot.hide{opacity:0;pointer-events:none}
@keyframes bootpulse{0%,100%{opacity:.45}50%{opacity:1}}
#boot .sq{width:46px;height:46px;display:grid;grid-template-columns:1fr 1fr;gap:5px;animation:bootpulse 1.1s ease-in-out infinite}
</style>
</head>
<body>
<div id="boot"><div class="sq"><div style="background:#c8553d;border-radius:7px"></div><div style="background:#2f7e8c;border-radius:7px"></div><div style="background:#cba968;border-radius:7px"></div><div style="background:#2b2622;border-radius:7px"></div></div></div>
<div id="root"></div>
<script type="text/babel" src="cn-components.jsx"></script>
<script type="text/babel" src="cn-lobby.jsx"></script>
<script type="text/babel" src="cn-landing.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<Landing />);
requestAnimationFrame(() => { const b = document.getElementById('boot'); if (b) { b.classList.add('hide'); setTimeout(() => b.remove(), 400); } });
</script>
</body>
</html>
