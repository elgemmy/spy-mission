<!doctype html>
<html lang="ar" dir="rtl" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1e8da" />
    <meta
      name="description"
      content="لعبة كلمات وجواسيس للعائلة — بالعربية والإنجليزية، بدون تطبيق. A family word-spy party game in the browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spymaster Mission" />
    <meta
      property="og:description"
      content="One clue. 25 words. Two teams. Play with your family in the browser — Arabic or English."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Spymaster Mission — One clue. 25 words. Two teams.</title>
    <!-- Boot splash: runs before the stylesheet exists, so raw hex here only. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: grid;
        place-items: center;
        background: #f1e8da;
        transition: opacity 0.35s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-mark {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        width: 46px;
        height: 46px;
        animation: bootpulse 1.1s ease-in-out infinite alternate;
      }
      #boot .boot-mark span {
        border-radius: 7px;
      }
      @keyframes bootpulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark {
          animation: none;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-mark">
        <span style="background: #c8553d"></span>
        <span style="background: #2f7e8c"></span>
        <span style="background: #cba968"></span>
        <span style="background: #2b2622"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
